name: Build e publicar APK

# O GitHub (que tem Android Studio de fábrica) compila o APK e sobe no
# Release — o usuário baixa direto em https://github.com/juliarleal55-stack/Adb-no-Android-/releases
#
# Gatilhos:
#  - push nesta branch (automático)
#  - botão manual na aba "Actions" (workflow_dispatch)
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "arena/b2929d32-adb-no-android"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: actions/setup-android@v3

      - name: Aceitar licenças e instalar pacotes
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Compilar APK (debug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Publicar APK no GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0"
          # Re-execução: remove o release anterior para o upload não falhar
          gh release delete "$TAG" --yes --cleanup-tag 2> /dev/null || true
          NOTES="APK de teste (debug) gerado automaticamente no GitHub Actions. Instale no celular (permita apps de fontes desconhecidas) e teste. O app: terminal ADB com root, USB/OTG, Wi-Fi, logcat ao vivo, pull/push e sideload."
          gh release create "$TAG" app/build/outputs/apk/debug/app-debug.apk --title "ADB no Android $TAG" --notes "$NOTES"
