name: Perm test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Check token perms
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "token present: $([ -n "$GITHUB_TOKEN" ] && echo yes || echo no)"
          gh auth status 2>&1 | head -5 || true
          echo "done"
