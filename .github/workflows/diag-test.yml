name: Diag test

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/b2929d32-adb-no-android"

jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: setup android
        uses: actions/setup-android@v3
      - name: use secret env + echo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "java: $(java -version 2>&1 | head -1)"
          echo "diag done"
