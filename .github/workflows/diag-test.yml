name: Diag test

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/b2929d32-adb-no-android"

jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: inspect preinstalled android sdk
        run: |
          set -x
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" 2>&1 | head -20
          # sdkmanager pode estar em cmdline-tools/latest/bin
          for p in "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
                   "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
                   /usr/lib/android-sdk/cmdline-tools/latest/bin/sdkmanager; do
            [ -x "$p" ] && echo "FOUND sdkmanager: $p" && "$p" --version && break
          done
          echo "--- installed packages (amostra) ---"
          ( "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>/dev/null || true ) | head -30
          echo "diag done"
